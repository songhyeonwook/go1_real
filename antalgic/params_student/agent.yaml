seed: 42
device: cuda:0
num_steps_per_env: 32
max_iterations: 12000
empirical_normalization: {}
obs_groups:
  student:
  - policy
  teacher:
  - policy
  - privileged_obs
clip_actions: null
check_for_nan: true
save_interval: 100
experiment_name: unitree_go1_rough_student
run_name: phase3_ws_antalgic_s42
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: DistillationRunner
student: {}
teacher: {}
algorithm:
  class_name: Distillation
  num_learning_epochs: 5
  learning_rate: 0.0005
  gradient_length: 32
  max_grad_norm: 1.0
  optimizer: adam
  loss_type: mse
policy:
  class_name: StudentTeacherRecurrent
  init_noise_std: 0.05
  noise_std_type: log
  student_obs_normalization: false
  teacher_obs_normalization: false
  student_hidden_dims:
  - 512
  - 256
  - 128
  teacher_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  rnn_type: lstm
  rnn_hidden_dim: 256
  rnn_num_layers: 1
  teacher_recurrent: false
